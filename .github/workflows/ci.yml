name: CareOrbit CI / CD & Docker Pipeline

on:
  push:
    branches: [main, fix/careorbit-production-hardening]
  pull_request:
    branches: [main, fix/careorbit-production-hardening]

jobs:
  validate-and-build:
    name: Lint, Test & Validate Next.js Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"

      - name: Install Dependencies
        run: npm ci

      - name: TypeScript Type Check
        run: npx tsc --noEmit

      - name: ESLint Code Quality Gate
        run: npm run lint

      - name: Run Unit & API Test Suites
        run: npm test

      - name: Validate Next.js Production Standalone Build
        run: npm run build

  docker-build:
    name: Production Docker Container Build Gate
    needs: validate-and-build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Production Container Image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          push: false
          tags: careorbit:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
